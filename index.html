<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BongCode - WBCHSE Study Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <style>
    /* Hide scrollbars for clean horizontal scrolling */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Smooth transitions for interactive elements */
    .glass-card { transition: all 0.2s ease-in-out; }
    .glass-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05); }
  </style>
</head>
<body class="bg-zinc-50 font-sans text-zinc-900 p-4 md:p-8 min-h-screen antialiased">

  <main id="homeView" class="max-w-6xl mx-auto block">
    <header class="text-center mb-12 mt-8">
      <h1 class="text-4xl md:text-5xl font-extrabold text-zinc-900 tracking-tight mb-3">BongCode 📚</h1>
      <p class="text-zinc-500 font-medium text-sm md:text-base tracking-wide uppercase">WBCHSE Study Materials & Assessments</p>
    </header>

    <section class="mb-14 max-w-2xl mx-auto">
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
          <svg class="w-5 h-5 text-zinc-400 group-focus-within:text-zinc-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
        </div>
        <input 
          type="text" 
          id="mainSearch" 
          placeholder="Search materials, chapters, or subjects..." 
          class="w-full py-3.5 pl-12 pr-4 bg-white border border-zinc-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent text-base transition-all"
        >
      </div>
    </section>

    <div id="homeContainer" class="space-y-16"></div>
  </main>

  <main id="seeAllView" class="max-w-6xl mx-auto hidden">
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 mt-6 gap-4 border-b border-zinc-200 pb-6">
      <button onclick="goHome()" class="flex items-center gap-2 text-zinc-500 hover:text-zinc-900 font-semibold transition text-sm">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" /></svg>
        Back to Dashboard
      </button>
      <h1 id="seeAllTitle" class="text-2xl font-bold text-zinc-900 tracking-tight">Class Materials</h1>
      <div class="w-24 hidden md:block"></div>
    </div>

    <section class="mb-10 max-w-2xl">
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
          <svg class="w-5 h-5 text-zinc-400 group-focus-within:text-zinc-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
        </div>
        <input type="text" id="seeAllSearch" placeholder="Filter this directory..." class="w-full py-3 pl-12 pr-4 bg-white border border-zinc-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 text-sm transition-all">
      </div>
    </section>

    <div id="seeAllContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <script>
    // ==========================================
    // 🎨 SVG ICONS LIBRARY (Professional look)
    // ==========================================
    const ICONS = {
      pdf: `<svg class="w-5 h-5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>`,
      link: `<svg class="w-5 h-5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" /></svg>`,
      view: `<svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>`,
      download: `<svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>`,
      external: `<svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" /></svg>`,
      arrowRight: `<svg class="w-4 h-4 ml-1" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>`
    };

    // ==========================================
    // 📝 1. DATA SOURCE
    // ==========================================
    const myFiles = [
      "pdfs/HS 2026 SEM-3 COMS Model Paper Part 2.pdf",
      "pdfs/SEM-3 COMA HTML Important Tags.pdf",
      "pdfs/SEM-4 COMS Networking Notes.pdf",
      "pdfs/Class 11 COMA Boolean Algebra Notes.pdf",
      "pdfs/SEM-1 COMS Important MCQs.pdf",
      "pdfs/SEM-2 COMA Database Concepts.pdf",
      "pdfs/General WBCHSE Syllabus 2026.pdf",
      "https://forms.gle/logic-gates-mock-test-link" 
    ];

    // ==========================================
    // ⚙️ 2. AUTO-PARSER LOGIC (Emoji-Free)
    // ==========================================
    const studyMaterials = myFiles.map(path => {
      const isLink = path.startsWith("http");
      const rawName = isLink ? path : path.split('/').pop().replace('.pdf', '');
      const lowerName = rawName.toLowerCase();
      
      let subjectTitle = "Other Subjects";
      let searchSubject = "Other";
      if (lowerName.includes("coms") || lowerName.includes("computer science")) {
        subjectTitle = "Computer Science (COMS)";
        searchSubject = "COMS Computer Science";
      } else if (lowerName.includes("coma") || lowerName.includes("application")) {
        subjectTitle = "Computer Application (COMA)";
        searchSubject = "COMA Computer Application";
      }

      let mainClass = "Uncategorized";
      let category = "General References";

      if (lowerName.match(/sem[- ]?1|semester 1/)) { mainClass = "Class 11"; category = "Semester 1"; }
      else if (lowerName.match(/sem[- ]?2|semester 2/)) { mainClass = "Class 11"; category = "Semester 2"; }
      else if (lowerName.includes("class 11")) { mainClass = "Class 11"; category = "Class 11 Resources"; }
      
      else if (lowerName.match(/sem[- ]?3|semester 3/)) { mainClass = "Class 12"; category = "Semester 3"; }
      else if (lowerName.match(/sem[- ]?4|semester 4/)) { mainClass = "Class 12"; category = "Semester 4"; }
      else if (lowerName.includes("class 12") || lowerName.includes("hs 2026")) { mainClass = "Class 12"; category = "Class 12 Resources"; }

      const displayTitle = isLink && !lowerName.includes("sem") ? "Online Assessment / Quiz" : rawName;

      return {
        displayTitle,
        fileName: path,
        mainClass,
        subjectTitle,
        category,
        format: isLink ? "Link" : "PDF",
        searchString: `${displayTitle} ${mainClass} ${category} ${searchSubject}`
      };
    });

    // ==========================================
    // 🧠 3. SMART FUZZY SEARCH
    // ==========================================
    function fuzzySearch(query, dataList) {
      if (!query) return dataList;
      const fuse = new Fuse(dataList, {
        keys: ['searchString'],
        threshold: 0.35,
        ignoreLocation: true,
        minMatchCharLength: 2
      });
      return fuse.search(query).map(result => result.item);
    }

    // ==========================================
    // 🎨 4. DISPLAY LOGIC (Home View)
    // ==========================================
    const homeView = document.getElementById("homeView");
    const seeAllView = document.getElementById("seeAllView");
    const homeContainer = document.getElementById("homeContainer");
    
    function renderHome(query = "") {
      homeContainer.innerHTML = ""; 
      const filteredData = fuzzySearch(query, studyMaterials);

      if (filteredData.length === 0) {
        homeContainer.innerHTML = `<div class="text-center py-16 text-zinc-500 border border-zinc-200 border-dashed rounded-xl"><p class="text-lg font-medium">No documents match your search.</p></div>`;
        return;
      }

      const groupedData = {};
      filteredData.forEach(item => {
        if (!groupedData[item.mainClass]) groupedData[item.mainClass] = {};
        if (!groupedData[item.mainClass][item.subjectTitle]) groupedData[item.mainClass][item.subjectTitle] = {};
        if (!groupedData[item.mainClass][item.subjectTitle][item.category]) groupedData[item.mainClass][item.subjectTitle][item.category] = [];
        groupedData[item.mainClass][item.subjectTitle][item.category].push(item);
      });

      for (const className in groupedData) {
        let classHTML = `
          <div class="mb-12">
            <div class="flex justify-between items-end border-b-2 border-zinc-900 pb-3 mb-6">
              <h2 class="text-2xl md:text-3xl font-extrabold text-zinc-900 tracking-tight">${className}</h2>
              <button onclick="openSeeAll('${className}')" class="flex items-center text-sm font-semibold text-zinc-600 hover:text-zinc-900 transition">
                View Directory ${ICONS.arrowRight}
              </button>
            </div>
        `;

        for (const subject in groupedData[className]) {
          classHTML += `
            <div class="mb-8">
              <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-widest mb-4 pl-1">${subject}</h3>
              <div class="flex overflow-x-auto gap-5 pb-4 snap-x snap-mandatory no-scrollbar">
          `;

          for (const category in groupedData[className][subject]) {
            classHTML += `
              <div class="snap-start shrink-0 w-[300px] md:w-[340px] bg-white border border-zinc-200 rounded-xl flex flex-col shadow-sm">
                <div class="bg-zinc-50/50 px-4 py-3 border-b border-zinc-100 rounded-t-xl">
                  <h4 class="font-semibold text-zinc-800 text-sm tracking-wide">${category}</h4>
                </div>
                <div class="p-4 flex-grow space-y-3">
            `;
            groupedData[className][subject][category].forEach(item => { classHTML += generateCardHTML(item); });
            classHTML += `</div></div>`; 
          }
          classHTML += `</div></div>`; 
        }
        classHTML += `</div>`; 
        homeContainer.innerHTML += classHTML;
      }
    }

    // ==========================================
    // 📂 5. DISPLAY LOGIC ("See All" View)
    // ==========================================
    let currentSeeAllClass = "";
    const seeAllContainer = document.getElementById("seeAllContainer");
    const seeAllTitle = document.getElementById("seeAllTitle");

    function openSeeAll(className) {
      currentSeeAllClass = className;
      document.getElementById("seeAllSearch").value = ""; 
      
      homeView.classList.add("hidden");
      seeAllView.classList.remove("hidden");
      seeAllTitle.innerText = `${className} Directory`;
      renderSeeAll();
      window.scrollTo(0, 0);
    }

    function goHome() {
      seeAllView.classList.add("hidden");
      homeView.classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function renderSeeAll(query = "") {
      seeAllContainer.innerHTML = "";
      
      const classData = studyMaterials.filter(item => item.mainClass === currentSeeAllClass);
      const filteredData = fuzzySearch(query, classData);

      if (filteredData.length === 0) {
        seeAllContainer.innerHTML = `<div class="col-span-full text-center py-16 text-zinc-500 border border-zinc-200 border-dashed rounded-xl"><p class="text-lg font-medium">No documents match your search.</p></div>`;
        return;
      }

      const groupedSeeAll = {};
      filteredData.forEach(item => {
        if (!groupedSeeAll[item.subjectTitle]) groupedSeeAll[item.subjectTitle] = [];
        groupedSeeAll[item.subjectTitle].push(item);
      });

      for (const subject in groupedSeeAll) {
        seeAllContainer.innerHTML += `
          <div class="col-span-full border-b border-zinc-200 pb-2 mt-8 mb-4">
            <h3 class="text-sm font-bold text-zinc-400 uppercase tracking-widest">${subject}</h3>
          </div>
        `;

        groupedSeeAll[subject].forEach(item => {
          seeAllContainer.innerHTML += `
            <div class="bg-white border border-zinc-200 rounded-xl p-5 glass-card flex flex-col justify-between">
              <div class="mb-6">
                <span class="inline-block px-2.5 py-1 bg-zinc-100 text-zinc-600 text-[10px] font-bold uppercase tracking-wider rounded mb-4">${item.category}</span>
                <div class="flex items-start gap-3">
                  <div class="mt-0.5">${item.format === 'PDF' ? ICONS.pdf : ICONS.link}</div>
                  <p class="font-bold text-zinc-800 text-sm leading-snug">${item.displayTitle}</p>
                </div>
              </div>
              ${generateButtonsHTML(item)}
            </div>
          `;
        });
      }
    }

    // ==========================================
    // 🧩 6. HELPER COMPONENTS
    // ==========================================
    function generateCardHTML(item) {
      return `
        <div class="group border border-zinc-100 rounded-lg p-3.5 hover:border-zinc-300 transition-colors bg-white">
          <div class="flex items-start gap-3 mb-4">
            <div class="mt-0.5">${item.format === 'PDF' ? ICONS.pdf : ICONS.link}</div>
            <p class="font-semibold text-sm text-zinc-700 leading-tight group-hover:text-zinc-900 transition-colors">${item.displayTitle}</p>
          </div>
          ${generateButtonsHTML(item)}
        </div>
      `;
    }

    function generateButtonsHTML(item) {
      if (item.format === "PDF") {
        return `
          <div class="flex gap-2 w-full">
            <a href="${item.fileName}" target="_blank" class="flex-1 flex justify-center items-center bg-white border border-zinc-200 text-zinc-700 py-2 rounded-md text-xs font-bold hover:bg-zinc-50 hover:border-zinc-300 transition-all">
              ${ICONS.view} View
            </a>
            <a href="${item.fileName}" download target="_blank" class="flex-1 flex justify-center items-center bg-zinc-900 text-white py-2 rounded-md text-xs font-bold hover:bg-zinc-800 transition-all shadow-sm">
              ${ICONS.download} Save
            </a>
          </div>
        `;
      } else {
        return `
          <a href="${item.fileName}" target="_blank" rel="noopener noreferrer" class="flex justify-center items-center w-full bg-zinc-900 text-white py-2 rounded-md text-xs font-bold hover:bg-zinc-800 transition-all shadow-sm">
            ${ICONS.external} Open Portal
          </a>
        `;
      }
    }

    // ==========================================
    // 🎧 7. EVENT LISTENERS
    // ==========================================
    document.getElementById("mainSearch").addEventListener("input", (e) => renderHome(e.target.value));
    document.getElementById("seeAllSearch").addEventListener("input", (e) => renderSeeAll(e.target.value));
    renderHome();
  </script>
</body>
</html>
